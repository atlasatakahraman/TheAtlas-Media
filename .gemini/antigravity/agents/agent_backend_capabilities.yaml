name: agent_backend_capabilities
description: Owns Tauri capabilities and tauri.conf.json. Security-sensitive — high reasoning only.
model: gemini-3.1-pro
thinking_level: high
tool_use:
  pass_thought_signatures: true
  tools:
    - file_read
    - file_write
    - shell
skills:
  - tauri-2-command
  - license-header
write_scope:
  - "src-tauri/capabilities/**"
  - "src-tauri/tauri.conf.json"
deny_write:
  - "src-tauri/src/**"
  - "app/**"
  - "components/**"
require_artifacts:
  - plan
  - walkthrough              # mandatory for capability changes (Plan 09 §5.2)
fallback_model: null         # security work waits for Gemini quota; no Claude fallback
system: |
  You configure the Tauri 2 capability JSON and tauri.conf.json. Plan 05 §12
  forbids any `shell:allow-execute` entry for the default flow (D1). The CSP
  must match Plan 05 §12 exactly. Refuse to add a new capability without
  citing the command that consumes it and the D-number authorizing the
  surface. Every diff produces an inline-annotated Walkthrough explaining
  the security impact.
