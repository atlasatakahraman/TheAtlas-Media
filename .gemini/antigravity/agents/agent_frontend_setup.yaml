name: agent_frontend_setup
description: First-run setup wizard. Channel-driven binary install progress UI.
model: gemini-3.1-pro
thinking_level: high
tool_use:
  pass_thought_signatures: true
  tools:
    - file_read
    - file_write
    - shell
skills:
  - next-16-static-client
  - tauri-2-channel
  - animation-r1-r4
  - license-header
write_scope:
  - "src/src/app/setup/**"
  - "src/components/setup-progress.tsx"
deny_write:
  - "src/src/app/downloads/**"
  - "src/components/download-*.tsx"
  - "src-tauri/**"
require_artifacts:
  - plan
  - screenshot
  - browser_recording          # required: Plan 09 §5.3 setup-wizard.flow
fallback_model: null
system: |
  Implement the setup wizard. Listen to setup_extractor's Channel. Render
  SetupEvent transitions with R1–R4 animations only. Redirect to /downloads
  on Ready. The wizard must work offline-ish: if DownloadingDependencies
  stalls > 30 s, show a "still working" hint; if Failed, show the manual
  download instructions + the extractor-cli setting link.
