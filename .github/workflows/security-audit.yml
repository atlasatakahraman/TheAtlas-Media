name: Security Audit

on:
    pull_request:
        paths:
            - "src-tauri/Cargo.toml"
            - "src-tauri/Cargo.lock"
            - "package.json"
            - "bun.lock"
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.97.1

            # cargo audit is deliberately NOT run here. It reads the same RustSec
            # database as `cargo deny check advisories`, which already runs in the
            # supply-chain job of ci.yml with deny.toml's `unmaintained = "workspace"`
            # scoping. Running both meant this job failed on every PR for transitive
            # GTK3/unic advisories that deny.toml deliberately tolerates - so CI
            # carried no signal. See CLAUDE.md, "Commands".

            - name: bun audit
              # Reports, never blocks. Findings are all transitive dev-tooling chains,
              # so failing here made the job red on every PR and CI carried no signal.
              # Vulnerabilities in first-party or runtime deps are handled on their own,
              # not by this gate.
              continue-on-error: true
              run: bun audit

            - name: Install Gitleaks
              run: |
                  wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
                  tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
                  sudo mv gitleaks /usr/local/bin/

            - name: Run Gitleaks
              run: gitleaks detect --source . -v
