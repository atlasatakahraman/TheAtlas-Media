name: Agents Doc Drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.9

      - name: Install Next.js
        run: pnpm install --frozen-lockfile

      - name: Snapshot docs
        run: |
          mkdir -p .docs-snapshot
          cp -r node_modules/next/dist/docs/* .docs-snapshot/ || true
          tar -czf docs-snapshot.tar.gz .docs-snapshot/

      - name: Check for drift
        run: |
          echo "If changed since last snapshot, open an issue tagged 'agents:doc-drift'."

      - name: Cache snapshot
        uses: actions/cache@v4
        with:
          path: docs-snapshot.tar.gz
          key: docs-snapshot-${{ github.run_id }}
          restore-keys: |
            docs-snapshot-
