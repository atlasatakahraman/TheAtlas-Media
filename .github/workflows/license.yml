name: License Harvesting & Verification

on:
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'package.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: License Check Stub
        run: |
          echo "TODO: License harvesting deferred to Plan 08."
          echo "This workflow exists so the policy gate is in place; it currently runs gitleaks"
          echo "and grep for accidental commit of personal info ('atlasatakahraman' in source files)."

      - name: Grep for personal info
        run: |
          if git grep -qi "atlasatakahraman" -- src/ src-tauri/src/; then
            echo "Accidental personal info commit found!"
            exit 1
          fi
