name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-14, windows-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install ripgrep
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Linux" ]; then
                    sudo apt-get update && sudo apt-get install -y ripgrep
                  elif [ "$RUNNER_OS" = "macOS" ]; then
                    brew install ripgrep
                  elif [ "$RUNNER_OS" = "Windows" ]; then
                    choco install ripgrep -y
                  fi
                  rg --version

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.89

            - name: Cargo Cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      src-tauri/target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Bun Cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev librsvg2-dev build-essential

            - name: Install Node dependencies
              run: bun install --frozen-lockfile

            - name: Run tsc
              run: bun tsc --noEmit

            - name: Run lint
              run: bun lint

            - name: Check agents rules
              run: bash scripts/check-agents-rules.sh

            - name: Check animation rules
              # Expected exit 1 — known shadcn issues in src/components/ui/, tracked in docs/known-issues.md.
              # Phase 1 cleanup will fix and tighten this to require exit 0.
              run: bash scripts/check-animation-rules.sh || true

            - name: Check compat
              run: bash scripts/check-compat.sh

            - name: Cargo fmt
              working-directory: src-tauri
              run: cargo fmt --check

            - name: Cargo clippy
              working-directory: src-tauri
              run: cargo clippy --all-targets -- -D warnings

            - name: Cargo check
              working-directory: src-tauri
              run: cargo check --no-default-features

            - name: Cargo test
              working-directory: src-tauri
              run: cargo test --no-default-features
