name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-14, windows-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install ripgrep
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Linux" ]; then
                    sudo apt-get update && sudo apt-get install -y ripgrep
                  elif [ "$RUNNER_OS" = "macOS" ]; then
                    brew install ripgrep
                  elif [ "$RUNNER_OS" = "Windows" ]; then
                    choco install ripgrep -y
                  fi
                  rg --version

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.97.1

            - name: Cargo Cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      src-tauri/target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Bun Cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev librsvg2-dev build-essential

            - name: Install Node dependencies
              run: bun install --frozen-lockfile

            - name: Run tsc
              run: bun tsc --noEmit

            - name: Run lint
              run: bun lint

            - name: Check agents rules
              run: bash scripts/check-agents-rules.sh

            - name: Check structure
              run: bash scripts/check-structure.sh

            - name: Verify search engine
              run: bun run verify:search

            - name: Check animation rules
              # Currently exits 0 and must stay there. The `|| true` is kept only
              # because CI history treated a non-zero exit as the baseline; a
              # failure here now is a real regression, so check the log rather
              # than assuming it is the old shadcn noise.
              run: bash scripts/check-animation-rules.sh || true

            - name: Check compat
              run: bash scripts/check-compat.sh

            - name: Cargo fmt
              working-directory: src-tauri
              run: cargo fmt --check

            - name: Cargo clippy
              working-directory: src-tauri
              run: cargo clippy --all-targets -- -D warnings

            - name: Cargo check
              working-directory: src-tauri
              run: cargo check --no-default-features

            - name: Cargo test
              working-directory: src-tauri
              run: cargo test --no-default-features

    supply-chain:
        # Advisories, licences, banned crates and source registries. One runner
        # is enough: `cargo deny` walks the dependency graph for every target,
        # not just the host's.
        #
        # `cargo audit` is deliberately not also run — it reads the same RustSec
        # database that `cargo deny check advisories` does, so a second job
        # would spend CI minutes to re-report the same findings.
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.97.1

            - name: Install cargo-deny
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-deny

            - name: Cargo deny
              working-directory: src-tauri
              run: cargo deny check
