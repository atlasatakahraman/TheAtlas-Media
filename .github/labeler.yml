# actions/labeler v5+ schema. The v4 form (a bare glob list per label) fails with
#   "found unexpected type for label 'frontend' (should be array of config options)"
# and that failure looked identical to a real CI failure on every PR.
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - 'postcss.config.mjs'
          - 'components.json'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src-tauri/**/*'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'README.md'
          - 'CLAUDE.md'
          - 'AGENTS.md'

agents:
  - changed-files:
      - any-glob-to-any-file:
          - '.gemini/**/*'
          - 'scripts/**/*'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

licensing:
  - changed-files:
      - any-glob-to-any-file:
          - 'LICENSE*'
