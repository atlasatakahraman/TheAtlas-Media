# Supply-chain policy for `cargo deny check`.
#
# Rust's memory safety stops at the dependency boundary: a `build.rs` or a
# proc-macro runs arbitrary code with full filesystem access at build time, so
# `cargo check` alone is an execution vector for a hostile crate. This file is
# the gate.
#
# The licence allowlist is the part that earns its keep on this project. The
# app ships under GPL-3.0-only (AAKNCL-1.0 until 2026-09-21). A GPL-3.0 crate
# is compatible now, but an AGPL, SSPL or GPL-2.0-only crate linked into the
# binary is a licence conflict rather than a style question, and every licence
# still needs a line here before it lands. A `yt-dlp` crate that was declared,
# never imported, and GPL-3.0 sat in this manifest until it was found by hand.

[graph]
all-features = false

[advisories]
# Known CVEs and yanked releases are a hard stop.
yanked = "deny"
# Only fail on an unmaintained crate this project depends on directly. The
# transitive set here is entirely GTK3 bindings and the `unic-*` family, both
# reached through Tauri and neither replaceable from this side. Failing the
# build on those would train everyone to pass `--allow` and would then hide the
# first unmaintained crate we *could* do something about.
unmaintained = "workspace"
ignore = []

[bans]
# Duplicate versions bloat the binary and mean two copies of a crate's state.
# A warning rather than an error because the Tauri and reqwest trees pull in
# overlapping transitive versions that this app cannot unify by itself.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Superseded by `zeroize`; `clear_on_drop` needs a C compiler and is
    # unmaintained.
    { name = "clear_on_drop" },
]

[licenses]
# Exactly the licences present in the current tree — no speculative headroom,
# so `cargo deny` stays silent when it passes and every entry is one somebody
# actually checked. A new dependency under an unlisted licence fails the build,
# which is the prompt to check it against GPL-3.0-only (reject AGPL, SSPL and
# GPL-2.0-only) before adding a line here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# This crate's own licence (GPL-3.0-only) is not a dependency licence and does
# not belong in the allowlist. The exception scopes that to this crate alone —
# every dependency is still held to the allowlist above.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only. A git dependency has no immutable version to audit against.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
