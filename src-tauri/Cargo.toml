[package]
name = "app"
version = "0.1.0"
description = "Youtube Agent"
authors = ["atlasata"]
license = "GPL-3.0-only"
repository = "https://github.com/atlasata/theatlas-youtube"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-oauth = "2.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
dotenv = "0.15"
open = "5.0"
url = "2.5"
urlencoding = "2.1"
