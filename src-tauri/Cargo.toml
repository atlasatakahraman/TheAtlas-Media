[package]
name = "theatlas-media"
version = "0.0.1"
description = "A high-performance desktop app for downloading, extracting, and converting media."
authors = ["atlasatakahraman"]
license = "AAKNCL-1.0"
repository = "https://github.com/atlasatakahraman/TheAtlas-Media"
edition = "2021"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
regex = "1.13.1"
reqwest = "0.13.4"
urlencoding = "2.1.3"
yt-dlp = "2.8.2"
tokio = { version = "1.53.1", features = ["process", "time", "fs", "io-util"] }
thiserror = "2"
tar = "0.4"
xz2 = "0.1"
zip = "2"
